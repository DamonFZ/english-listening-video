<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <title>看图二选一 A/B 对比 - 英语听力</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 1080px; height: 1920px;
      background: #0f172a; overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    #stage { display: block; width: 1080px; height: 1920px; }
  </style>
</head>
<body>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <!-- 音频元素：由 Python 注入 data URI；其音轨被并入录制流 -->
  <audio id="audio" preload="auto" crossorigin="anonymous"></audio>

  <script>
  (function () {
    const W = 1080, H = 1920;
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const audioEl = document.getElementById("audio");

    const PAD = 60;
    const IMG = { x: 60, y: 230, w: 960, h: 900 };   // 对比图区域
    const SUB = { x: 60, y: 1180, w: 960, h: 200 };    // 字幕区
    const HINT = { x: 60, y: 1430, w: 960, h: 230 };   // 提示/倒计时区
    const REV = { x: 60, y: 1700, w: 960, h: 160 };    // 揭晓区

    const state = {
      q: null,
      img: null,
      phase: "idle",      // idle | ready | countdown | playing | reveal
      countdown: 0,
      playing: false,
      revealed: false,
      highlight: "",      // "A" / "B"
      flash: 0,
    };

    let audioCtx = null, audioDest = null, mediaSource = null;

    // ---------------- 绘图工具 ----------------
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
    function drawBackground() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#1e3a8a");
      g.addColorStop(0.6, "#0f172a");
      g.addColorStop(1, "#020617");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    function drawHeader() {
      const q = state.q || {};
      // 学段角标
      ctx.font = "bold 34px 'PingFang SC', sans-serif";
      const badge = q.levelBadge || "";
      if (badge) {
        const tw = ctx.measureText(badge).width;
        roundRect(PAD, 60, tw + 72, 68, 34);
        ctx.fillStyle = "rgba(255,255,255,0.14)";
        ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.textBaseline = "middle"; ctx.textAlign = "left";
        ctx.fillText(badge, PAD + 36, 60 + 34);
      }
      // 标题
      ctx.font = "bold 46px 'PingFang SC', sans-serif";
      ctx.fillStyle = "#fde68a"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.fillText(q.title || "看图二选一", W - PAD, 60 + 34);
    }
    function drawImageArea() {
      // 背景卡片
      roundRect(IMG.x, IMG.y, IMG.w, IMG.h, 32);
      ctx.fillStyle = "rgba(255,255,255,0.06)"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.stroke();

      if (state.img && state.img.complete && state.img.naturalWidth) {
        const iw = state.img.naturalWidth, ih = state.img.naturalHeight;
        const scale = Math.min(IMG.w / iw, IMG.h / ih) * 0.92;
        const dw = iw * scale, dh = ih * scale;
        const dx = IMG.x + (IMG.w - dw) / 2, dy = IMG.y + (IMG.h - dh) / 2;
        ctx.drawImage(state.img, dx, dy, dw, dh);
      } else {
        ctx.fillStyle = "rgba(255,255,255,0.4)";
        ctx.font = "36px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("（图片加载中）", IMG.x + IMG.w / 2, IMG.y + IMG.h / 2);
      }

      // A / B 角标
      drawBadge("A", IMG.x + 90, IMG.y + IMG.h - 90);
      drawBadge("B", IMG.x + IMG.w - 90, IMG.y + IMG.h - 90);
    }
    function drawBadge(letter, cx, cy) {
      const correct = (state.highlight === letter);
      ctx.beginPath(); ctx.arc(cx, cy, 52, 0, Math.PI * 2);
      ctx.fillStyle = correct ? "#22c55e" : "#f59e0b";
      ctx.fill();
      if (correct) {
        ctx.lineWidth = 8; ctx.strokeStyle = "rgba(34,197,94,0.6)";
        ctx.beginPath(); ctx.arc(cx, cy, 64 + Math.sin(state.flash) * 6, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = "#111"; ctx.font = "bold 46px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(letter, cx, cy + 2);
    }
    function drawSubtitle() {
      const q = state.q || {};
      roundRect(SUB.x, SUB.y, SUB.w, SUB.h, 24);
      ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,0.15)"; ctx.stroke();
      ctx.fillStyle = "#f8fafc"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "bold 52px 'PingFang SC', sans-serif";
      ctx.fillText(q.subtitleEn || "", SUB.x + SUB.w / 2, SUB.y + 62);
      ctx.fillStyle = "#cbd5e1"; ctx.font = "32px 'PingFang SC', sans-serif";
      ctx.fillText(q.subtitleZh || "", SUB.x + SUB.w / 2, SUB.y + 132);
    }
    function drawHint() {
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const cx = HINT.x + HINT.w / 2, cy = HINT.y + HINT.h / 2;
      if (state.phase === "countdown" && state.countdown > 0) {
        ctx.fillStyle = "#fbbf24"; ctx.font = "bold 36px sans-serif";
        ctx.fillText("听音作答倒计时", cx, cy - 60);
        ctx.fillStyle = "#f87171"; ctx.font = "bold 140px sans-serif";
        ctx.fillText(String(state.countdown), cx, cy + 40);
      } else if (state.phase === "playing") {
        ctx.fillStyle = "#38bdf8"; ctx.font = "bold 40px sans-serif";
        const dots = ".".repeat((Math.floor(state.flash / 8) % 3) + 1);
        ctx.fillText("正在播放听力" + dots, cx, cy);
      } else if (state.phase === "ready") {
        ctx.fillStyle = "#fbbf24"; ctx.font = "bold 40px sans-serif";
        ctx.fillText("请看题目，准备听音", cx, cy);
      } else {
        ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.font = "34px sans-serif";
        ctx.fillText("听一听，选一选", cx, cy);
      }
    }
    function drawReveal() {
      if (!state.revealed) return;
      const q = state.q || {};
      roundRect(REV.x, REV.y, REV.w, REV.h, 24);
      ctx.fillStyle = "rgba(34,197,94,0.15)"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#22c55e"; ctx.stroke();
      ctx.fillStyle = "#4ade80"; ctx.font = "bold 60px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("正确答案：" + (q.answer || "?"), REV.x + REV.w / 2, REV.y + 55);
      if (q.explain) {
        ctx.fillStyle = "#e2e8f0"; ctx.font = "30px 'PingFang SC', sans-serif";
        wrapText(q.explain, REV.x + REV.w / 2, REV.y + 112, REV.w - 80, 38, "center");
      }
    }
    function wrapText(text, cx, y, maxWidth, lineHeight, align) {
      const chars = (text || "").split("");
      let line = "", lines = [];
      for (const c of chars) {
        const test = line + c;
        if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = c; }
        else line = test;
      }
      if (line) lines.push(line);
      const startY = y - ((lines.length - 1) * lineHeight) / 2;
      ctx.textAlign = align || "center"; ctx.textBaseline = "middle";
      lines.forEach((ln, i) => ctx.fillText(ln, cx, startY + i * lineHeight));
    }
    function render() {
      drawBackground();
      drawHeader();
      drawImageArea();
      drawSubtitle();
      drawHint();
      drawReveal();
    }
    function tick() {
      state.flash += 1;
      render();
      state._raf = requestAnimationFrame(tick);
    }
    tick();

    // ---------------- 音频图构建 ----------------
    function ensureAudioGraph() {
      if (audioCtx) return audioDest.stream;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      mediaSource = audioCtx.createMediaElementSource(audioEl);
      audioDest = audioCtx.createMediaStreamDestination();
      mediaSource.connect(audioDest);
      mediaSource.connect(audioCtx.destination);
      return audioDest.stream;
    }

    function pickMime() {
      const list = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
      for (const t of list) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
      }
      return "";
    }

    const Stage = {
      getState() { return state.phase; },

      loadQuestion(payload) {
        state.q = payload || {};
        state.phase = "ready"; state.revealed = false; state.highlight = "";
        state.img = new Image();
        state.img.crossOrigin = "anonymous";
        return new Promise((resolve) => {
          state.img.onload = () => { render(); resolve(true); };
          state.img.onerror = () => { render(); resolve(false); };
          state.img.src = (state.q && state.q.image) || "";
        });
      },

      /**
       * 跑完整录制流水线并返回 { base64, mime }。
       * opts: { countdown, audioSrc, revealDelay, revealHold, answer, explain }
       */
      async runFlow(opts) {
        opts = opts || {};
        const q = state.q || {};
        if (opts.answer) q.answer = opts.answer;
        if (opts.explain !== undefined) q.explain = opts.explain;

        // 等待图片就绪
        let tries = 0;
        while ((!state.img || !state.img.complete) && tries < 100) {
          await new Promise(r => setTimeout(r, 30)); tries++;
        }

        const canvasStream = canvas.captureStream(30);
        const audioStream = ensureAudioGraph();
        const tracks = [
          ...canvasStream.getVideoTracks(),
          ...audioStream.getAudioTracks(),
        ];
        const stream = new MediaStream(tracks);
        const mime = pickMime();
        const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
        const chunks = [];
        recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };

        const done = new Promise((resolve) => {
          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mime || "video/webm" });
            const reader = new FileReader();
            reader.onload = () => resolve({ base64: reader.result, mime: blob.type });
            reader.onerror = () => resolve({ base64: "", mime: blob.type });
            reader.readAsDataURL(blob);
          };
        });

        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        recorder.start(1000);

        // 1) 审题展示
        state.phase = "ready"; await sleep(1500);

        // 2) 倒计时
        const cd = Math.max(0, opts.countdown || 0);
        state.phase = "countdown";
        for (let n = cd; n >= 1; n--) { state.countdown = n; await sleep(1000); }
        state.countdown = 0;

        // 3) 播放听力音频
        state.phase = "playing"; state.playing = true;
        let audioEnded = false;
        if (opts.audioSrc) {
          audioEl.src = opts.audioSrc;
          const ended = new Promise((res) => {
            audioEl.onended = () => res(true);
            audioEl.onerror = () => res(false);
          });
          try { await audioEl.play(); } catch (e) { console.warn("play failed", e); }
          // 等待音频结束或最长 30s 兜底
          await Promise.race([ended, sleep(30000)]);
          audioEnded = true;
        } else {
          await sleep(2000);
        }
        state.playing = false;

        // 4) 揭晓前停顿
        await sleep((opts.revealDelay || 0));

        // 5) 答案揭晓
        state.revealed = true;
        state.highlight = (q.answer || "").toString().toUpperCase();
        state.phase = "reveal";
        await sleep((opts.revealHold || 3000));

        recorder.stop();
        const result = await done;

        // 停止所有轨道
        stream.getTracks().forEach(t => t.stop());
        audioEl.pause(); audioEl.removeAttribute("src");
        state.phase = "done";
        return result;
      },

      reset() {
        state.q = null; state.phase = "idle"; state.revealed = false;
        state.highlight = ""; state.img = null;
        audioEl.pause(); audioEl.removeAttribute("src");
        render();
        return true;
      },
    };

    window.Stage = Stage;
  })();
  </script>
</body>
</html>
