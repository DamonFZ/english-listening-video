<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>纯听力 · 极简原图（横竖屏自适应）</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #FFFFFF; overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    #stage { display: block; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <!-- 音频元素：由 Python 注入 data URI；其音轨被并入录制流 -->
  <audio id="audio" preload="auto" crossorigin="anonymous"></audio>

  <script>
  (function () {
    // ---------- 动态尺寸：浏览器视口即画幅 ----------
    const W = window.innerWidth;
    const H = window.innerHeight;
    const canvas = document.getElementById("stage");
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    const ctx = canvas.getContext("2d");
    const audioEl = document.getElementById("audio");

    const BG = "#FFFFFF";
    const TITLE_COLOR = "#1f2937";

    // ---------- 布局参数按方向分岔 ----------
    // orientation 从 payload 读，这里先按横屏默认初始化，loadQuestion 后按需重算
    let orient = "landscape";

    function layoutParams() {
      if (orient === "portrait") {
        return {
          titleY: 110,
          titleSize: 58,
          // 兜底：竖屏也提供 imgArea（contain 单一复合图用）
          imgArea: { x: 72, y: 170, w: 936, h: 1420 },
          topCardArea: { x: 72, y: 170, w: 936, h: 780 },
          bottomCardArea: { x: 72, y: 1020, w: 936, h: 680 },
          gapBetween: 56,
          bottomSafeY: H - 220,   // 底部安全区起始 Y（220px 纯白留白，避开视频号/抖音底栏）
          titleAlign: "center",
          titleText: "英语听力：哪张图是对的？",
          cardA: "A", cardB: "B",
        };
      }
      // 默认横屏：单一复合图最大化
      return {
        titleY: 80,
        titleSize: 66,
        imgArea: { x: 96, y: 130, w: 1728, h: 912 },   // 宽约 90%，高约 84%
        topCardArea: null,       // 横屏不用
        bottomCardArea: null,
        bottomSafeY: H,   // 横屏不强制底部安全区
        titleAlign: "center",
        titleText: "英语听力：哪张图是对的？",
      };
    }

    const state = {
      q: null,
      img: null,          // 横屏单一复合图
      imgA: null,         // 竖屏上卡（图 A）
      imgB: null,         // 竖屏下卡（图 B）
      phase: "idle",
      flash: 0,
    };

    let audioCtx = null, audioDest = null;

    function drawBackground() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, W, H);
    }

    function drawTitle() {
      const q = state.q || {};
      const lp = layoutParams();
      const text = q.title || lp.titleText;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = TITLE_COLOR;
      ctx.font = "bold " + lp.titleSize + "px 'PingFang SC', 'Microsoft YaHei', sans-serif";
      ctx.fillText(text, W / 2, lp.titleY);
    }

    function drawSingleImage() {
      const lp = layoutParams();
      const a = lp.imgArea;
      if (state.img && state.img.complete && state.img.naturalWidth) {
        const iw = state.img.naturalWidth, ih = state.img.naturalHeight;
        const scale = Math.min(a.w / iw, a.h / ih);
        const dw = iw * scale, dh = ih * scale;
        const dx = a.x + (a.w - dw) / 2, dy = a.y + (a.h - dh) / 2;
        ctx.drawImage(state.img, dx, dy, dw, dh);
      } else {
        ctx.fillStyle = "#9ca3af";
        ctx.font = "32px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("（图片加载中）", a.x + a.w / 2, a.y + a.h / 2);
      }
    }

    function drawBadge(letter, cx, cy) {
      // 蓝底白边粗体白字圆形徽标（覆盖原图自带的徽标，保证一致视觉）
      const r = 46;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = "#2563eb";     // 蓝底
      ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = "#FFFFFF"; ctx.stroke(); // 白边
      ctx.fillStyle = "#FFFFFF";     // 白字
      ctx.font = "bold 48px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(letter, cx, cy + 3);
    }

    function drawStackedCards() {
      const lp = layoutParams();
      drawCard(state.imgA, lp.topCardArea, "A", lp.cardA);
      drawCard(state.imgB, lp.bottomCardArea, "B", lp.cardB);
    }

    function drawCard(img, area, badgeLetter, _letterKey) {
      // 卡片底（纯白，不画边框，靠圆角卡片与画布的反差出层次）
      roundRect(area.x, area.y, area.w, area.h, 28);
      ctx.fillStyle = "#FFFFFF"; ctx.fill();

      if (img && img.complete && img.naturalWidth) {
        const iw = img.naturalWidth, ih = img.naturalHeight;
        const scale = Math.min(area.w / iw, area.h / ih) * 0.96;   // 稍留内边距
        const dw = iw * scale, dh = ih * scale;
        const dx = area.x + (area.w - dw) / 2, dy = area.y + (area.h - dh) / 2;
        ctx.drawImage(img, dx, dy, dw, dh);
      } else {
        ctx.fillStyle = "#9ca3af";
        ctx.font = "32px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("（图片加载中）", area.x + area.w / 2, area.y + area.h / 2);
      }
      // 左上蓝圆徽标（覆盖原图自带）
      drawBadge(badgeLetter, area.x + 60, area.y + 60);
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function render() {
      drawBackground();
      drawTitle();
      if (orient === "portrait" && state.imgA && state.imgB) {
        drawStackedCards();
      } else {
        drawSingleImage();
      }
      // 竖屏模式：底部安全区已在画布范围内（drawBackground 已填充纯白），
      // 不用额外绘制任何底部元素。横屏也不画底部文字。
    }

    function tick() {
      state.flash += 1;
      render();
      state._raf = requestAnimationFrame(tick);
    }
    tick();

    // ---------------- 音频图构建 ----------------
    function ensureAudioGraph() {
      if (audioCtx) return audioDest.stream;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const mediaSource = audioCtx.createMediaElementSource(audioEl);
      audioDest = audioCtx.createMediaStreamDestination();
      mediaSource.connect(audioDest);
      mediaSource.connect(audioCtx.destination);
      return audioDest.stream;
    }

    function pickMime() {
      const list = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
      for (const t of list) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
      }
      return "";
    }

    const Stage = {
      getState() { return state.phase; },

      loadQuestion(payload) {
        state.q = payload || {};
        orient = ((state.q && state.q.orientation) || "landscape").toString().toLowerCase();
        state.phase = "ready";

        // 横屏：加载单一复合图
        if (orient !== "portrait") {
          state.img = new Image();
          state.img.crossOrigin = "anonymous";
          return new Promise((resolve) => {
            state.img.onload = () => { render(); resolve(true); };
            state.img.onerror = () => { render(); resolve(false); };
            state.img.src = (state.q && state.q.image) || "";
          });
        }

        // 竖屏：优先加载独立 A/B 图；缺一则回退到单一图 contain 缩放
        const srcA = (state.q && state.q.imageA) || "";
        const srcB = (state.q && state.q.imageB) || "";
        const fallback = (state.q && state.q.image) || "";
        const loadOne = (src) => new Promise((resolve) => {
          if (!src) return resolve(null);
          const im = new Image(); im.crossOrigin = "anonymous";
          im.onload = () => resolve(im);
          im.onerror = () => resolve(null);
          im.src = src;
        });
        return Promise.all([loadOne(srcA || fallback), loadOne(srcB || fallback)]).then(([a, b]) => {
          state.imgA = a;
          state.imgB = b;
          render();
          return true;
        });
      },

      /**
       * 极简纯听力流水线：展示图 → 播放音频 → 音频播完自然收尾。
       * 全程不展示答案、翻译或解析；竖屏底部留白保持纯白。
       */
      async runFlow(opts) {
        opts = opts || {};
        if (audioCtx && audioCtx.state === "suspended") { try { await audioCtx.resume(); } catch (e) {} }

        // 等待图片就绪
        let tries = 0;
        const needsImg = (orient === "portrait")
          ? ((!state.imgA || !state.imgA.complete) || (!state.imgB || !state.imgB.complete))
          : (!state.img || !state.img.complete);
        while (needsImg && tries < 150) {
          await new Promise(r => setTimeout(r, 30)); tries++;
        }

        const canvasStream = canvas.captureStream(30);
        const audioStream = ensureAudioGraph();
        const stream = new MediaStream([
          ...canvasStream.getVideoTracks(),
          ...audioStream.getAudioTracks(),
        ]);
        const mime = pickMime();
        const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
        const chunks = [];
        recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };

        const done = new Promise((resolve) => {
          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mime || "video/webm" });
            const reader = new FileReader();
            reader.onload = () => resolve({ base64: reader.result, mime: blob.type });
            reader.onerror = () => resolve({ base64: "", mime: blob.type });
            reader.readAsDataURL(blob);
          };
        });

        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        recorder.start(1000);

        // 短暂静态帧（让观众看清题目与图），再开始播放
        state.phase = "ready";
        await sleep(1000);

        // 播放听力音频（不显示任何原文/答案）
        state.phase = "listening";
        if (opts.audioSrc) {
          audioEl.src = opts.audioSrc;
          const ended = new Promise((res) => {
            audioEl.onended = () => res(true);
            audioEl.onerror = () => res(false);
          });
          try { await audioEl.play(); } catch (e) { console.warn("play failed", e); }
          await Promise.race([ended, sleep(60000)]);
        } else {
          await sleep(2500);
        }

        // 音频播完后自然收尾，停留约 1.2s 再结束录制
        state.phase = "done";
        await sleep(1200);

        recorder.stop();
        const result = await done;

        stream.getTracks().forEach(t => t.stop());
        audioEl.pause(); audioEl.removeAttribute("src");
        return result;
      },

      reset() {
        state.q = null; state.phase = "idle";
        state.img = null; state.imgA = null; state.imgB = null;
        audioEl.pause(); audioEl.removeAttribute("src");
        render();
        return true;
      },
    };

    window.Stage = Stage;
  })();
  </script>
</body>
</html>
